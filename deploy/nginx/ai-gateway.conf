# نسخ هذا الملف إلى السيرفر: /etc/nginx/conf.d/ai-gateway.conf
# ثم: sudo nginx -t && sudo systemctl reload nginx

server {
  listen 80;
  server_name ai.halfspeace.space;

  # (اختياري لاحقًا: SSL عبر Cloudflare أو certbot)

  location /health {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  location /chat {
    # 1) اسمح فقط لأورجن موقعك
    if ($http_origin !~* "^https://(www\.)?halfspeace\.space$") { return 403; }

    # 2) لازم site key
    if ($http_x_site_key = "") { return 401; }

    # 3) site key صحيح (غيّر HSPS_ChangeMe_32chars في السيرفر وفي متغير البيئة بالموقع)
    if ($http_x_site_key != "HSPS_ChangeMe_32chars") { return 401; }

    # CORS
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Headers "content-type,x-site-key" always;
    add_header Access-Control-Allow-Methods "POST,OPTIONS" always;

    if ($request_method = OPTIONS) { return 204; }

    proxy_pass http://127.0.0.1:999;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
